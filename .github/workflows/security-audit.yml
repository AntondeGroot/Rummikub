name: Security Audit

# OWASP Dependency-Check is slow and needs the NVD database, so it runs on main and weekly rather
# than on every PR. npm audit runs in the CI workflow on every PR already.
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  owasp:
    name: OWASP dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - run: mvn verify -P security-check -DskipTests --batch-mode --no-transfer-progress
        working-directory: server
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
