name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test backend
        run: mvn -B clean verify --file server/pom.xml

  # The only check the branch ruleset requires, so jobs can be added or renamed without editing it.
  # `if: always()` matters: without it a failed dependency skips this job, and a skipped required
  # check counts as passing.
  ci:
    if: always()
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
