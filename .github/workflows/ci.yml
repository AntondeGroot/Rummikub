name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test backend
        run: mvn -B clean verify --file server/pom.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        working-directory: client

      # npm audit --audit-level=high, with known unfixable advisories allowlisted in audit-ci.jsonc.
      - name: Security audit
        run: npm run audit
        working-directory: client

      - name: Lint
        run: npm run lint
        working-directory: client

      - name: Lint styles
        run: npm run lint:styles
        working-directory: client

      - name: Format check
        run: npm run format:check
        working-directory: client

      - name: Run tests with coverage
        run: npm test -- --watch=false --coverage
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client

  # The only check the branch ruleset requires, so jobs can be added or renamed without editing it.
  # `if: always()` matters: without it a failed dependency skips this job, and a skipped required
  # check counts as passing.
  ci:
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
