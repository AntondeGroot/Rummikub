# Structural lint gate for all three specs. The `recommended` ruleset enables `struct`, which validates schema
# objects against the OpenAPI meta-schema; openapi-generator would accept those mistakes and silently turn
# them into empty or mis-bound models. Run it before codegen.
apis:
  gameroom:
    root: openapi/gameroom-api.yml
  session:
    root: openapi/game-session-api.yml
  rummikub:
    root: openapi/rummikub-api.yml

extends:
  - recommended

rules:
  # No auth by design. security-defined is `error` in recommended and would fail once per operation.
  # OpenAPI security schemes are declarative only; adding one needs real server-side enforcement.
  security-defined: off
  # The repo's LICENSE is not declared in the specs.
  info-license: off
